  <text x="90" y="214" fill="#572C33" font-family="Georgia,Times New Roman,serif" font-weight="400" font-size="75" >More than</text><text x="90" y="301" fill="#572C33" font-family="Georgia,Times New Roman,serif" font-weight="400" font-size="75" >an event.</text>
   <text x="90" y="390" fill="#C46D49" font-family="Georgia,Times New Roman,serif" font-weight="400" font-size="34" font-style="italic">A moment of connection.</text>
   <line x1="90" y1="428" x2="700" y2="428" stroke="#D2A25F" stroke-width="3"/>
   <text x="92" y="487" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="23" >SAANJH is an imagined cultural gathering built</text>
   <text x="92" y="523" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="23" >around the stories, rituals and creative traditions</text>
   <text x="92" y="559" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="23" >that bring communities together.</text>
   <text x="92" y="641" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="23" >This portfolio concept explores how thoughtful</text>
   <text x="92" y="677" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="23" >editorial design can carry the spirit of an event</text>
   <text x="92" y="713" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="23" >while making its information easy to navigate.</text>
