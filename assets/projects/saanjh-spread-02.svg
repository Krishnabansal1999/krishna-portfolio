  <text x="88" y="217" fill="#572C33" font-family="Georgia,Times New Roman,serif" font-weight="400" font-size="74" >Be part of</text><text x="88" y="304" fill="#572C33" font-family="Georgia,Times New Roman,serif" font-weight="400" font-size="74" >the story.</text>
 <text x="91" y="372" fill="#C46D49" font-family="Georgia,Times New Roman,serif" font-weight="400" font-size="33" font-style="italic">Meaningful by design.</text>
 <line x1="90" y1="418" x2="705" y2="418" stroke="#D2A25F" stroke-width="3"/>
 <text x="91" y="487" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="24" >Event sponsorship is more than a logo</text>
 <text x="91" y="525" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="24" >on a wall. It is an opportunity to be</text>
 <text x="91" y="563" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="24" >present in moments that matter.</text>
 <text x="91" y="650" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="24" >The design organises partner offerings</text>
 <text x="91" y="688" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="24" >into a clear, useful presentation that</text>
 <text x="91" y="726" fill="#572C33" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="24" >balances impact with practical detail.</text>
